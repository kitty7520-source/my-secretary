<script>

function md(v){
 if(!v)return "";
 let p=v.split("-");
 return p.length===3?(Number(p[1])+"/"+Number(p[2])):v;
}
let mainDTTarget="";
function dtText(date,time){return [md(date),time].filter(Boolean).join(" ")||"日期時間"}
function updateMainDTButtons(){let g=document.querySelector("#genericDateBox input"),e=document.querySelector("#eventDateBox input"),t=document.querySelector("#tradeDateBox input");if($("#genericDateTimeBtn"))$("#genericDateTimeBtn").textContent=dtText(g?.value||"",$("#time")?.value||"");if($("#orderDateBtn"))$("#orderDateBtn").textContent=md(g?.value||"")||"日期";if($("#eventDateTimeBtn"))$("#eventDateTimeBtn").textContent=dtText(e?.value||"",$("#eventTime")?.value||"");if($("#tradeDateTimeBtn"))$("#tradeDateTimeBtn").textContent=dtText(t?.value||"",$("#tradeTime")?.value||"")}
function openMainDT(target){mainDTTarget=target;let box=target==="event"?$("#eventDateBox"):target==="trade"?$("#tradeDateBox"):$("#genericDateBox");let timeEl=target==="event"?$("#eventTime"):target==="trade"?$("#tradeTime"):$("#time");$("#mainPickDate").value=box?.querySelector("input")?.value||"";$("#mainPickTime").value=timeEl?.value||"";$("#mainDTModal").style.display="block"}
function closeMainDT(){$("#mainDTModal").style.display="none";mainDTTarget=""}
function confirmMainDT(){let target=mainDTTarget;let box=target==="event"?$("#eventDateBox"):target==="trade"?$("#tradeDateBox"):$("#genericDateBox");let timeEl=target==="event"?$("#eventTime"):target==="trade"?$("#tradeTime"):$("#time");let date=$("#mainPickDate").value,time=$("#mainPickTime").value;if(box)box.innerHTML=dateInputHTML(date,`this.dataset.sync=this.value`,target==="event"?"活動日期":"日期");if(timeEl)timeEl.value=time;updateMainDTButtons();closeMainDT()}
function dateInputHTML(value,onchangeCode,label){
 let v=value||"";
 return `<div class="shortDateWrap" style="position:relative;width:100%;height:100%">
   <input type="date" value="${v}" aria-label="${label||'日期'}" onchange="${onchangeCode};this.nextElementSibling.textContent=md(this.value)" style="position:absolute;inset:0;opacity:0;width:100%;height:100%">
   <div style="display:flex;align-items:center;height:100%;font-size:12px;pointer-events:none">${md(v)||"月/日"}</div>
 </div>`;
}

const $=s=>document.querySelector(s), DATAKEY="secretaryV8", SYSKEY="secretaryV8Systems";
let records=JSON.parse(localStorage.getItem(DATAKEY)||"[]");
records.forEach(r=>{if(r.main==="面交")r.main="交易"});
let systems=JSON.parse(localStorage.getItem(SYSKEY)||'null')||[
{name:"拓元",required:["訂單編號","取票序號"],methods:["7-11","全家","現場取票","寄送"],defaultMethod:"7-11"},
{name:"KKTIX",required:["訂單編號"],methods:["全家","現場取票","電子票券"],defaultMethod:"全家"},
{name:"ibon",required:["取票序號"],methods:["7-11","現場取票"],defaultMethod:"7-11"},
{name:"年代",required:["訂單編號"],methods:["7-11","全家","寄送"],defaultMethod:"7-11"}];
let saleDTIndex=-1,sales=[],photos=[],previewIndex=-1,currentCategory='工作',currentSub='',currentRecordId=null,editingId=null;

let tradeItems=[];
function addTradeItem(item){tradeItems.push(item||{name:"",qty:1});renderTradeItems()}
function renderTradeItems(){let box=$("#tradeItems");if(!box)return;box.innerHTML=tradeItems.map((x,i)=>`<div class="tradeItem"><div class="field"><input placeholder="品名" value="${esc(x.name||"")}" oninput="tradeItems[${i}].name=this.value"></div><div class="field"><input type="number" min="1" value="${Number(x.qty)||1}" oninput="tradeItems[${i}].qty=Math.max(1,Number(this.value)||1)"></div><button type="button" class="tradeDel" onclick="tradeItems.splice(${i},1);renderTradeItems()">×</button></div>`).join("")}
function openTradeMap(){let q=$("#tradeLocation").value;if(q)window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}

function show(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));$("#"+id).classList.add("on");scrollTo(0,0)}
function setSubs(){let m=$("#main").value,s=$("#sub"),old=s.value;s.innerHTML=m==="工作"?'<option>下單</option><option>記事</option>':m==="活動"?'<option>演唱會</option><option>展覽</option><option>電影</option><option>其它</option>':"";if([...s.options].some(o=>o.value===old))s.value=old}
function ui(){
 setSubs();
 let m=$("#main").value,s=$("#sub").value;
 let concert=m==="活動"&&s==="演唱會";
 let otherActivity=m==="活動"&&["展覽","電影","其它"].includes(s);
 let order=m==="工作"&&s==="下單";
 let trade=m==="交易";
 $("#subbox").style.display=trade?"none":"";
 $("#third").style.visibility=order?"visible":"hidden";
 $("#concertUI").classList.toggle("hidden",!concert);
 $("#tradeUI").classList.toggle("hidden",!trade);
 $("#activityOtherUI").classList.toggle("hidden",!otherActivity);
 $("#genericUI").classList.toggle("hidden",concert||trade||otherActivity);
 if($("#genericDateLocationRow"))$("#genericDateLocationRow").style.display=order?"none":"grid";
 if($("#orderScheduleRow"))$("#orderScheduleRow").style.display=order?"grid":"none";
 if(concert){renderSystems();renderSales();renderPickup()}
}
function toggleSec(id,arrow){let e=$("#"+id),a=$("#"+arrow),hide=!e.classList.contains("hidden");e.classList.toggle("hidden",hide);a.textContent=hide?"›":"⌄"}
function renderSystems(){let s=$("#ticketSystem"),v=s.value;s.innerHTML=systems.map(x=>`<option>${x.name}</option>`).join("");if(systems.some(x=>x.name===v))s.value=v;renderPickup()}
function saleDTText(x){return [md(x.date),x.time].filter(Boolean).join(" ")||"日期時間"}
function openSaleDT(i){saleDTIndex=i;$("#salePickDate").value=sales[i].date||"";$("#salePickTime").value=sales[i].time||"";$("#saleDTModal").style.display="block"}
function closeSaleDT(){$("#saleDTModal").style.display="none";saleDTIndex=-1}
function confirmSaleDT(){if(saleDTIndex<0)return;sales[saleDTIndex].date=$("#salePickDate").value;sales[saleDTIndex].time=$("#salePickTime").value;closeSaleDT();renderSales()}
function addSale(){sales.push({date:"",time:"",type:"公售",related:""});renderSales()}
function renderSales(){let h=sales.map((x,i)=>`<div class="saleRow">
<div class="field saleDateTime"><button type="button" onclick="openSaleDT(${i})">${saleDTText(x)}</button></div><i></i>
<div class="field"><select onchange="sales[${i}].type=this.value;sales[${i}].related='';renderSales()"><option ${x.type==="公售"?"selected":""}>公售</option><option ${x.type==="卡友"?"selected":""}>卡友</option><option ${x.type==="會員"?"selected":""}>會員</option><option ${x.type==="其它"?"selected":""}>其它</option></select></div><i></i>
<div>${relatedHTML(x,i)}</div><button class="del" onclick="sales.splice(${i},1);renderSales()">刪除</button></div>`).join("");$("#saleRows").innerHTML=h||'<div class="muted" style="padding:4px">尚未新增售票資訊</div>'}
function relatedHTML(x,i){if(x.type==="卡友")return `<div class="bankwrap"><div class="field"><select onchange="sales[${i}].related=this.value">${["中國信託","國泰世華","台新銀行","玉山銀行","台北富邦","永豐銀行"].map(b=>`<option ${x.related===b?"selected":""}>${b}</option>`).join("")}</select></div><button class="smallplus" onclick="addBank(${i})">＋</button></div>`;if(x.type==="會員"||x.type==="其它")return `<div class="field related"><input value="${x.related||""}" oninput="sales[${i}].related=this.value"></div>`;return '<div class="field" style="justify-content:center">—</div>'}
function addBank(i){let b=prompt("輸入銀行名稱");if(b){sales[i].related=b;renderSales()}}
function currentSystem(){return systems.find(x=>x.name===$("#ticketSystem").value)||systems[0]}
function systemChanged(){renderPickup()}
function renderPickup(){let box=$("#pickupBody");if(!box||!systems.length)return;let s=currentSystem();let vals={};box.querySelectorAll("[data-key]").forEach(e=>vals[e.dataset.key]=e.value);let fields=s.required.map((r,j)=>`<div class="pickupItem"><div class="label">${r}</div><div class="field"><input data-key="${r}" value="${vals[r]||""}"></div></div>`).join("");box.innerHTML=`<div class="pickupGrid">${fields}</div><div class="label">取票方式</div><div class="field"><select id="pickupMethod">${s.methods.map(m=>`<option ${m===s.defaultMethod?"selected":""}>${m}</option>`).join("")}</select></div>`}
function openManager(){renderManageSelect();$("#manager").style.display="block";loadManager()}
function closeManager(){$("#manager").style.display="none"}
function renderManageSelect(){let s=$("#manageSystem");s.innerHTML=systems.map((x,i)=>`<option value="${i}">${x.name}</option>`).join("")}
function loadManager(){let x=systems[+$("#manageSystem").value||0];$("#manageName").value=x.name;$("#requiredList").innerHTML=x.required.map((v,i)=>mgrRow("required",v,i)).join("");$("#methodList").innerHTML=x.methods.map((v,i)=>mgrRow("method",v,i)).join("");renderDefault(x)}
function mgrRow(t,v,i){return `<div class="managerRow"><div class="field"><input value="${v}" data-${t}="${i}"></div><button class="smallplus" onclick="${t==="required"?"addRequired()":"addMethod()"}">＋</button><button class="smallplus" onclick="removeMgr('${t}',${i})">−</button></div>`}
function renderDefault(x){$("#defaultMethod").innerHTML=x.methods.map(m=>`<option ${m===x.defaultMethod?"selected":""}>${m}</option>`).join("")}
function collectManager(){let idx=+$("#manageSystem").value||0,x=systems[idx];x.name=$("#manageName").value||x.name;x.required=[...document.querySelectorAll("[data-required]")].map(e=>e.value).filter(Boolean);x.methods=[...document.querySelectorAll("[data-method]")].map(e=>e.value).filter(Boolean);x.defaultMethod=$("#defaultMethod").value||x.methods[0]||"";return x}
function addRequired(){let x=collectManager();x.required.push("新欄位");loadManager()}
function addMethod(){let x=collectManager();x.methods.push("新方式");loadManager()}
function removeMgr(t,i){let x=collectManager();(t==="required"?x.required:x.methods).splice(i,1);if(!x.methods.includes(x.defaultMethod))x.defaultMethod=x.methods[0]||"";loadManager()}
function newSystem(){systems.push({name:"新售票系統",required:["取票資料"],methods:["7-11"],defaultMethod:"7-11"});renderManageSelect();$("#manageSystem").value=systems.length-1;loadManager()}
function saveManager(){collectManager();localStorage.setItem(SYSKEY,JSON.stringify(systems));renderSystems();closeManager()}
function deleteManagedSystem(){if(systems.length<=1){alert("至少需要保留一個售票系統");return}let idx=+$("#manageSystem").value||0,name=systems[idx].name;if(!confirm("確定刪除「"+name+"」售票系統？"))return;systems.splice(idx,1);localStorage.setItem(SYSKEY,JSON.stringify(systems));renderManageSelect();$("#manageSystem").value=0;loadManager();renderSystems()}
function openMap(){let q=$("#eventLocation").value;if(q)window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
function openOtherActivityMap(){let q=$("#otherActivityLocation").value;if(q)window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
function openGenericMap(){let q=$("#location").value;if(q)window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
function pickFiles(fs){[...fs].slice(0,10-photos.length).forEach(f=>{let r=new FileReader();r.onload=()=>{photos.push({data:r.result,at:Date.now()});renderPhotos()};r.readAsDataURL(f)})}
$("#camera").onchange=e=>pickFiles(e.target.files);$("#files").onchange=e=>pickFiles(e.target.files);
function renderPhotos(){$("#count").textContent=photos.length+" 張";$("#thumbs").innerHTML=photos.map((p,i)=>`<img class="thumb" src="${p.data}" onclick="togglePreview(${i})">`).join("");if(previewIndex>=photos.length){previewIndex=-1;$("#preview").style.display="none"}}
function togglePreview(i){if(previewIndex===i){previewIndex=-1;$("#preview").style.display="none"}else{previewIndex=i;$("#previewImg").src=photos[i].data;$("#preview").style.display="block"}}
function deleteCurrentPhoto(){if(previewIndex<0)return;photos.splice(previewIndex,1);previewIndex=-1;$("#preview").style.display="none";renderPhotos()}
function openAdd(){sales=[{date:"",time:"",type:"公售",related:""}];tradeItems=[];photos=[];previewIndex=-1;$("#main").value="工作";let now=new Date(),todayISO=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0"),nowTime=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");$("#genericDateBox").innerHTML=dateInputHTML(todayISO,`this.dataset.sync=this.value`,"日期");["location","title","memo","vendor","eventName","eventLocation","tradeLocation","tradeTitle","tradeContact","tradeMemo","otherActivityLocation","otherActivityTitle","otherActivityMemo"].forEach(id=>{let e=$("#"+id);if(e)e.value=""});["tradeBuy","tradeSell","tradeSwap"].forEach(id=>{let e=$("#"+id);if(e)e.checked=false});$("#time").value=nowTime;$("#eventDateBox").innerHTML=dateInputHTML(todayISO,`this.dataset.sync=this.value`,"活動日期");$("#eventTime").value=nowTime;$("#tradeDateBox").innerHTML=dateInputHTML(todayISO,`this.dataset.sync=this.value`,"日期");$("#tradeTime").value=nowTime;$("#otherActivityDate").value=todayISO;$("#otherActivityTime").value=nowTime;$("#del30").checked=false;["orderMorning","orderNoon","orderEvening"].forEach(id=>{let e=$("#"+id);if(e)e.checked=false});ui();updateMainDTButtons();renderTradeItems();renderPhotos();show("form")}
function cleanup(){let now=Date.now(),changed=false;records.forEach(r=>{if(r.delete30&&r.photos){let n=r.photos.filter(p=>now-p.at<2592000000);if(n.length!==r.photos.length){r.photos=n;changed=true}}});if(changed)localStorage.setItem(DATAKEY,JSON.stringify(records))}
function save(){
 let m=$("#main").value,s=$("#sub").value;
 let concert=m==="活動"&&s==="演唱會",order=m==="工作"&&s==="下單",trade=m==="交易";
 let rec={id:editingId||Date.now(),main:m,sub:trade?"":s,vendor:$("#vendor").value,photos,delete30:$("#del30").checked};
 if(concert){
   let pickup={};$("#pickupBody").querySelectorAll("[data-key]").forEach(e=>pickup[e.dataset.key]=e.value);
   Object.assign(rec,{title:$("#eventName").value,date:$("#eventDateBox input").value,time:$("#eventTime").value,location:$("#eventLocation").value,ticketSystem:$("#ticketSystem").value,sales:JSON.parse(JSON.stringify(sales)),pickup,pickupMethod:$("#pickupMethod")?.value||""});
 }else if(order){
   let dayparts=[];if($("#orderMorning").checked)dayparts.push("早");if($("#orderNoon").checked)dayparts.push("中");if($("#orderEvening").checked)dayparts.push("晚");
   Object.assign(rec,{title:$("#title").value,date:$("#genericDateBox input").value,time:"",location:"",orderDayparts:dayparts,memo:$("#memo").value});
 }else if(m==="活動"&&["展覽","電影","其它"].includes(s)){
   Object.assign(rec,{title:$("#otherActivityTitle").value,date:$("#otherActivityDate").value,time:$("#otherActivityTime").value,location:$("#otherActivityLocation").value,memo:$("#otherActivityMemo").value});
 }else if(trade){
   let types=[];if($("#tradeBuy").checked)types.push("買");if($("#tradeSell").checked)types.push("賣");if($("#tradeSwap").checked)types.push("換");
   Object.assign(rec,{title:$("#tradeTitle").value,date:$("#tradeDateBox input").value,time:$("#tradeTime").value,location:$("#tradeLocation").value,contact:$("#tradeContact").value,tradeTypes:types,tradeItems:JSON.parse(JSON.stringify(tradeItems)),memo:$("#tradeMemo").value});
 }else{
   Object.assign(rec,{title:$("#title").value,date:$("#genericDateBox input").value,time:$("#time").value,location:$("#location").value,memo:$("#memo").value});
 }
 if(editingId){let idx=records.findIndex(x=>x.id===editingId);if(idx>=0)records[idx]=rec}else records.unshift(rec);
 editingId=null;localStorage.setItem(DATAKEY,JSON.stringify(records));renderHome();show("home")
}
function renderHome(){
 cleanup();

 let orders=records.filter(r=>!r.completed&&r.main==="工作"&&r.sub==="下單");
 let orderGroups={};

 orders.forEach(r=>{
   let parts=(r.orderDayparts&&r.orderDayparts.length)?r.orderDayparts:[""];
   parts.forEach(p=>{
     let key=(r.date||"")+"|"+p;
     if(!orderGroups[key])orderGroups[key]={date:r.date||"",part:p,vendors:[]};
     let name=(r.vendor||r.title||"未命名").trim();
     if(name&&!orderGroups[key].vendors.includes(name))orderGroups[key].vendors.push(name);
   });
 });

 let partOrder={"早":0,"中":1,"午":1,"晚":2,"":3};
 let groupedOrders=Object.values(orderGroups).sort((a,b)=>{
   let da=a.date||"9999-12-31",db=b.date||"9999-12-31";
   if(da!==db)return da.localeCompare(db);
   return (partOrder[a.part]??9)-(partOrder[b.part]??9);
 });

 let items=[];
 records.filter(r=>!r.completed&&!(r.main==="工作"&&r.sub==="下單")).forEach(r=>{
   if(r.sales?.length)r.sales.forEach(s=>items.push({title:r.title||"活動售票",date:s.date,time:s.time,sub:s.type}));
   else items.push({title:r.title||r.vendor||r.main,date:r.date,time:r.time,sub:r.sub});
 });

 let stamp=x=>{
   let d=x.date||"9999-12-31",t=x.time||"23:59";
   return new Date(d+"T"+t).getTime()||Number.MAX_SAFE_INTEGER
 };
 items.sort((a,b)=>stamp(a)-stamp(b));

 let html="";
 groupedOrders.forEach(g=>{
   let dateText=md(g.date);
   let partText=g.part==="中"?"午":g.part;
   let vendors=g.vendors.map(esc).join("／");
   html+=`<div class="homeCard orderSummary" onclick="openCategory('工作','下單')"><b>${vendors}</b><div class="muted">${[dateText,partText].filter(Boolean).join(" ")}</div></div>`;
 });

 html+=items.slice(0,11).map(x=>`<div class="homeCard"><b>${x.title}</b><div class="muted">${[x.date,x.time,x.sub].filter(Boolean).join(" · ")}</div></div>`).join("");
 $("#reminders").innerHTML=html||'<div class="homeCard muted">目前沒有需要處理的提醒事項</div>';
}
function openCategory(cat,sub){currentCategory=cat;currentSub=sub||"";$("#catTitle").textContent=cat;renderCategory();show("category")}

function markRecordDone(id,ev){
 if(ev){ev.stopPropagation();ev.preventDefault()}
 let r=records.find(x=>x.id===id);
 if(!r)return;
 r.completed=true;
 r.completedAt=Date.now();
 localStorage.setItem(DATAKEY,JSON.stringify(records));
 renderHome();
 renderCategory();
}
function renderCategory(){
 let tabs=$("#catTabs");
 if(currentCategory==="工作"){
   let ss=["下單","記事"];
   if(!currentSub)currentSub="下單";
   tabs.className="subtabs two";
   tabs.innerHTML=ss.map(x=>`<button class="subtab ${currentSub===x?"active":""}" onclick="currentSub='${x}';renderCategory()">${x}</button>`).join("")
 }else if(currentCategory==="活動"){
   let ss=["演唱會","展覽","電影","其它"];
   if(!currentSub)currentSub="演唱會";
   tabs.className="subtabs four";
   tabs.innerHTML=ss.map(x=>`<button class="subtab ${currentSub===x?"active":""}" onclick="currentSub='${x}';renderCategory()">${x}</button>`).join("")
 }else{
   currentSub="";
   tabs.innerHTML=""
 }

 // 不因日期過期而隱藏；只有手動勾選完成才從清單消失
 let arr=records.filter(r=>!r.completed && ((currentCategory==="交易"&&(r.main==="交易"||r.main==="面交"))||r.main===currentCategory) && (!currentSub||r.sub===currentSub));

 // 依日期／時間由近到遠；沒有時間的排在同日後面
 arr.sort((a,b)=>{
   let ad=a.date||"9999-12-31", bd=b.date||"9999-12-31";
   if(ad!==bd)return ad.localeCompare(bd);
   let at=a.time||"23:59", bt=b.time||"23:59";
   return at.localeCompare(bt);
 });

 $("#catList").innerHTML=arr.length?arr.map(r=>`
   <button class="recordBtn" onclick="openDetail(${r.id})">
     <span class="recordMain">
       <b>${r.main==="工作"&&r.sub==="下單"
 ? esc([r.vendor,r.title].filter(Boolean).join("-")||"未命名")
 : esc(r.title||r.vendor||"未命名")}</b>
       <span class="muted">${[r.date,r.time,r.location].filter(Boolean).map(esc).join(" · ")}</span>
     </span>
     <span class="doneBox" role="checkbox" aria-label="標記已完成" onclick="markRecordDone(${r.id},event)">✓</span>
   </button>
 `).join(""):'<div class="homeCard muted">目前沒有未完成紀錄</div>'
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function detailRecords(){let arr=records.filter(r=>!r.completed&&((currentCategory==="交易"&&(r.main==="交易"||r.main==="面交"))||r.main===currentCategory)&&(!currentSub||r.sub===currentSub));arr.sort((a,b)=>{let ad=a.date||"9999-12-31",bd=b.date||"9999-12-31";if(ad!==bd)return ad.localeCompare(bd);return(a.time||"23:59").localeCompare(b.time||"23:59")});return arr}
function updateDetailNav(){let arr=detailRecords(),i=arr.findIndex(r=>r.id===currentRecordId),p=$("#prevRecordBtn"),n=$("#nextRecordBtn");if(p)p.disabled=i<=0;if(n)n.disabled=i<0||i>=arr.length-1}
function moveDetail(step){let arr=detailRecords(),i=arr.findIndex(r=>r.id===currentRecordId),next=arr[i+step];if(next)openDetail(next.id)}
function openDetail(id){currentRecordId=id;let r=records.find(x=>x.id===id);if(!r)return;let rows=[];let add=(k,v)=>{if(v)rows.push(`<div class="detailLine"><div class="detailLabel">${k}</div><div class="detailValue">${esc(v)}</div></div>`)};add("分類",[(r.main==="面交"?"交易":r.main),r.sub].filter(Boolean).join("／"));add("標題／活動名稱",r.title);add("廠商",r.vendor);add("日期",r.date);if(r.main==="工作"&&r.sub==="下單")add("時段",(r.orderDayparts||[]).join("／"));else add("時間",r.time);add("地點",r.location);
if(r.main==="活動"&&r.sub==="演唱會"){add("售票系統",r.ticketSystem);if(r.sales?.length)rows.push(`<div class="card"><b>售票資訊</b>${r.sales.map(s=>`<div class="detailLine"><div class="detailValue">${[s.date,s.time,s.type,s.related].filter(Boolean).map(esc).join(" ｜ ")}</div></div>`).join("")}</div>`);if(r.pickup&&Object.keys(r.pickup).length)rows.push(`<div class="card"><b>取票資訊</b>${Object.entries(r.pickup).map(([k,v])=>`<div class="detailLine"><span class="detailLabel">${esc(k)}</span><div class="detailValue">${esc(v)}</div></div>`).join("")}${r.pickupMethod?`<div class="detailLine"><span class="detailLabel">取票方式</span><div class="detailValue">${esc(r.pickupMethod)}</div></div>`:""}</div>`)}
add("備註",r.memo);if(r.photos?.length)rows.push(`<div class="card"><b>活動照片</b><div class="detailPhotos">${r.photos.map(p=>`<img class="detailPhoto" src="${p.data}" onclick="this.style.width=this.style.width==='100%'?'70px':'100%';this.style.height=this.style.width==='100%'?'auto':'70px'">`).join("")}</div></div>`);$("#detailBody").innerHTML=`<div class="card">${rows.join("")}</div>`;show("detail");updateDetailNav()}
function backToCategory(){openCategory(currentCategory,currentSub)}
function deleteCurrentRecord(){if(!confirm("確定刪除這筆紀錄？"))return;records=records.filter(x=>x.id!==currentRecordId);localStorage.setItem(DATAKEY,JSON.stringify(records));renderHome();openCategory(currentCategory,currentSub)}
function editCurrent(){
 let r=records.find(x=>String(x.id)===String(currentRecordId));
 if(!r){alert("找不到這筆紀錄，請返回清單後重新開啟");return}

 editingId=r.id;

 let mainEl=$("#main");
 if(!mainEl)return;
 mainEl.value=r.main==="面交"?"交易":r.main;
 setSubs();
 if(r.sub&&$("#sub"))$("#sub").value=r.sub;
 ui();

 if($("#vendor"))$("#vendor").value=r.vendor||"";

 // 照片功能：修改時完整載回原照片
 photos=JSON.parse(JSON.stringify(r.photos||[]));
 previewIndex=-1;
 if($("#preview"))$("#preview").style.display="none";
 if($("#del30"))$("#del30").checked=!!r.delete30;

 if(r.main==="活動"&&r.sub==="演唱會"){
   if($("#eventName"))$("#eventName").value=r.title||"";
   if($("#eventDateBox"))$("#eventDateBox").innerHTML=dateInputHTML(r.date||"",`this.dataset.sync=this.value`,"活動日期");
   if($("#eventTime"))$("#eventTime").value=r.time||"";
   if($("#eventLocation"))$("#eventLocation").value=r.location||"";

   renderSystems();
   if(r.ticketSystem&&systems.some(x=>x.name===r.ticketSystem)&&$("#ticketSystem"))$("#ticketSystem").value=r.ticketSystem;
   sales=JSON.parse(JSON.stringify(r.sales||[]));
   renderSales();
   renderPickup();

   setTimeout(()=>{
     if(r.pickup&&$("#pickupBody")){
       $("#pickupBody").querySelectorAll("[data-key]").forEach(e=>e.value=r.pickup[e.dataset.key]||"")
     }
     if($("#pickupMethod")&&r.pickupMethod)$("#pickupMethod").value=r.pickupMethod;
   },0);

 }else if(r.main==="工作"&&r.sub==="下單"){
   if($("#genericDateBox"))$("#genericDateBox").innerHTML=dateInputHTML(r.date||"",`this.dataset.sync=this.value`,"日期");
   if($("#title"))$("#title").value=r.title||"";
   if($("#memo"))$("#memo").value=r.memo||"";
   if($("#orderMorning"))$("#orderMorning").checked=(r.orderDayparts||[]).includes("早");
   if($("#orderNoon"))$("#orderNoon").checked=(r.orderDayparts||[]).includes("中")||(r.orderDayparts||[]).includes("午");
   if($("#orderEvening"))$("#orderEvening").checked=(r.orderDayparts||[]).includes("晚");

 }else if(r.main==="活動"&&["展覽","電影","其它"].includes(r.sub)){
   if($("#otherActivityDate"))$("#otherActivityDate").value=r.date||"";
   if($("#otherActivityTime"))$("#otherActivityTime").value=r.time||"";
   if($("#otherActivityLocation"))$("#otherActivityLocation").value=r.location||"";
   if($("#otherActivityTitle"))$("#otherActivityTitle").value=r.title||"";
   if($("#otherActivityMemo"))$("#otherActivityMemo").value=r.memo||"";

 }else if(r.main==="交易"||r.main==="面交"){
   if($("#tradeDateBox"))$("#tradeDateBox").innerHTML=dateInputHTML(r.date||"",`this.dataset.sync=this.value`,"日期");
   if($("#tradeTime"))$("#tradeTime").value=r.time||"";
   if($("#tradeLocation"))$("#tradeLocation").value=r.location||"";
   if($("#tradeTitle"))$("#tradeTitle").value=r.title||"";
   if($("#tradeContact"))$("#tradeContact").value=r.contact||"";
   if($("#tradeMemo"))$("#tradeMemo").value=r.memo||"";
   if($("#tradeBuy"))$("#tradeBuy").checked=(r.tradeTypes||[]).includes("買");
   if($("#tradeSell"))$("#tradeSell").checked=(r.tradeTypes||[]).includes("賣");
   if($("#tradeSwap"))$("#tradeSwap").checked=(r.tradeTypes||[]).includes("換");
   tradeItems=JSON.parse(JSON.stringify(r.tradeItems||[]));
   renderTradeItems();

 }else{
   if($("#genericDateBox"))$("#genericDateBox").innerHTML=dateInputHTML(r.date||"",`this.dataset.sync=this.value`,"日期");
   if($("#time"))$("#time").value=r.time||"";
   if($("#location"))$("#location").value=r.location||"";
   if($("#title"))$("#title").value=r.title||"";
   if($("#memo"))$("#memo").value=r.memo||"";
 }

 updateMainDTButtons();
 renderPhotos();
 show("form");
}

renderHome();ui();
</script></body></html>
