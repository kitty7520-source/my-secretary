function md(v){
 if(!v)return "";
 let m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
 if(m)return Number(m[2])+"/"+Number(m[3]);
 return String(v).replace(/^(\d{4})[\/-]/,"");
}

 if($("#eventDateTimeBtn"))$("#eventDateTimeBtn").textContent=dtText(e?.value||"",$("#eventTime")?.value||"");
 if($("#tradeDateTimeBtn"))$("#tradeDateTimeBtn").textContent=dtText(t?.value||"",$("#tradeTime")?.value||"");

}

 if(target==="event")return $("#eventDateBox");
 if(target==="trade")return $("#tradeDateBox");
 if(target==="otherActivity")return $("#otherActivityDateBox");
 return $("#genericDateBox")
}
function mainDTTime(target){
 if(target==="event")return $("#eventTime");

 $("#mainPickTime").value=timeEl?.value||"";

}

 let target=mainDTTarget,box=mainDTBox(target),timeEl=mainDTTime(target);
 let date=$("#mainPickDate").value,time=$("#mainPickTime").value;
 if(box)box.innerHTML=dateInputHTML(date,`this.dataset.sync=this.value`,target==="event"?"活動日期":"日期");
 if(timeEl)timeEl.value=time;

 return `<div class="shortDateWrap" style="position:relative;width:100%;height:100%">

function calendarDayNumber(v){if(!v)return null;let p=v.split("-").map(Number);if(p.length!==3||p.some(n=>!Number.isFinite(n)))return null;return Math.floor(Date.UTC(p[0],p[1]-1,p[2])/86400000)}
function todayDayNumber(){let n=new Date();return Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/86400000)}
function addRepeatDate(baseDate,every,unit,occurrence){
 if(!baseDate)return "";
 let p=baseDate.split("-").map(Number);if(p.length!==3)return "";
 let d=new Date(p[0],p[1]-1,p[2]);
 let n=(every||1)*occurrence;
 if(unit==="week")d.setDate(d.getDate()+7*n);
 else if(unit==="month")d.setMonth(d.getMonth()+n);
 else d.setDate(d.getDate()+n);
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function repeatOccurrenceForToday(r){
 let base=calendarDayNumber(r.date);if(base===null)return 0;
 let every=Math.max(1,parseInt(r.orderRepeatEvery||1,10)),unit=r.orderRepeatUnit||"day";
 let occ=0,limit=10000;
 while(limit-->0){
   let cur=addRepeatDate(r.date,every,unit,occ);
   let curDay=calendarDayNumber(cur);
   if(curDay===null)return occ;
   if(curDay>=todayDayNumber())return occ;
   occ++;
 }
 return occ;
}
function reminderStageForRecord(r){
 let day=calendarDayNumber(r.date);if(day===null)return null;
 if(r.main==="工作"&&r.sub==="下單"){
   if(r.orderRepeat){
     let occ=repeatOccurrenceForToday(r);
     let nextDate=addRepeatDate(r.date,Math.max(1,parseInt(r.orderRepeatEvery||1,10)),r.orderRepeatUnit||"day",occ);
     let diff=calendarDayNumber(nextDate)-todayDayNumber();
     return diff<=1?"order-repeat-"+occ:null;
   }
   let diff=day-todayDayNumber();
   return diff<=1?"order":null;
 }
 let diff=day-todayDayNumber();
 if(diff>14)return null;
 if(diff>=8)return "14";
 if(diff>=3)return "7";
 return "2";
}
function saleReminderStage(s){
 let day=calendarDayNumber(s?.date);if(day===null)return null;
 let diff=day-todayDayNumber();
 if(diff>14)return null;
 if(diff>=8)return "sale14";
 if(diff>=3)return "sale7";
 return "sale2";
}
function saleLabel(s){

 if(type==="卡友"&&related)return type+"-"+related;
 if((type==="會員"||type==="其它")&&related)return type+"-"+related;
 return type||related||"售票";
}
function orderReminderDate(r){
 if(!r.orderRepeat)return r.date||"";
 let occ=repeatOccurrenceForToday(r);
 return addRepeatDate(r.date,Math.max(1,parseInt(r.orderRepeatEvery||1,10)),r.orderRepeatUnit||"day",occ);
}

function detailRecords(){let arr=records.filter(r=>!r.completed&&((currentCategory==="交易"&&(r.main==="交易"||r.main==="面交"))||r.main===currentCategory)&&(!currentSub||r.sub===currentSub));arr.sort((a,b)=>{let ad=a.date||"9999-12-31",bd=b.date||"9999-12-31";if(ad!==bd)return ad.localeCompare(bd);return(a.time||"23:59").localeCompare(b.time||"23:59")});return arr}
function updateDetailNav(){let arr=detailRecords(),i=arr.findIndex(r=>r.id===currentRecordId),p=$("#prevRecordBtn"),n=$("#nextRecordBtn");if(p)p.disabled=i<=0;if(n)n.disabled=i<0||i>=arr.length-1}
function moveDetail(step){let arr=detailRecords(),i=arr.findIndex(r=>r.id===currentRecordId),next=arr[i+step];if(next)openDetail(next.id)}
function openDetail(id){currentRecordId=id;let r=records.find(x=>x.id===id);if(!r)return;let rows=[];let add=(k,v)=>{if(v)rows.push(`<div class="detailLine"><div class="detailLabel">${k}</div><div class="detailValue">${esc(v)}</div></div>`)};add("分類",[(r.main==="面交"?"交易":r.main),r.sub].filter(Boolean).join("／"));add("標題／活動名稱",r.title);add("廠商",r.vendor);add("日期",r.date);if(r.main==="工作"&&r.sub==="下單")add("時段",(r.orderDayparts||[]).join("／"));else add("時間",r.time);add("地點",r.location);
if(r.main==="活動"&&r.sub==="演唱會"){add("售票系統",r.ticketSystem);if(r.sales?.length)rows.push(`<div class="card"><b>售票資訊</b>${r.sales.map(s=>`<div class="detailLine"><div class="detailValue">${[s.date,s.time,s.type,s.related].filter(Boolean).map(esc).join(" ｜ ")}</div></div>`).join("")}</div>`);if(r.pickup&&Object.keys(r.pickup).length)rows.push(`<div class="card"><b>取票資訊</b>${Object.entries(r.pickup).map(([k,v])=>`<div class="detailLine"><span class="detailLabel">${esc(k)}</span><div class="detailValue">${esc(v)}</div></div>`).join("")}${r.pickupMethod?`<div class="detailLine"><span class="detailLabel">取票方式</span><div class="detailValue">${esc(r.pickupMethod)}</div></div>`:""}</div>`)}
add("備註",r.memo);if(r.photos?.length)rows.push(`<div class="card"><b>活動照片</b><div class="detailPhotos">${r.photos.map(p=>`<img class="detailPhoto" src="${p.data}" onclick="this.style.width=this.style.width==='100%'?'70px':'100%';this.style.height=this.style.width==='100%'?'auto':'70px'">`).join("")}</div></div>`);$("#detailBody").innerHTML=`<div class="card">${rows.join("")}</div>`;show("detail");updateDetailNav()}
function backToCategory(){openCategory(currentCategory,currentSub)}
function deleteCurrentRecord(){if(!confirm("確定刪除這筆紀錄？"))return;records=records.filter(x=>x.id!==currentRecordId);localStorage.setItem(DATAKEY,JSON.stringify(records));renderHome();openCategory(currentCategory,currentSub)}
function editCurrent(){
 let r=records.find(x=>String(x.id)===String(currentRecordId));
 if(!r){alert("找不到這筆紀錄，請返回清單後重新開啟");return}

 editingId=r.id;

 let mainEl=$("#main");
 if(!mainEl)return;
 mainEl.value=r.main==="面交"?"交易":r.main;
 setSubs();
 if(r.sub&&$("#sub"))$("#sub").value=r.sub;
 ui();

 if($("#vendor"))$("#vendor").value=r.vendor||"";

 // 照片功能：修改時完整載回原照片
 photos=JSON.parse(JSON.stringify(r.photos||[]));
 previewIndex=-1;
 if($("#preview"))$("#preview").style.display="none";
 if($("#del30"))$("#del30").checked=!!r.delete30;

 if(r.main==="活動"&&r.sub==="演唱會"){
   if($("#eventName"))$("#eventName").value=r.title||"";
   if($("#eventDateBox"))$("#eventDateBox").innerHTML=dateInputHTML(r.date||"",`this.dataset.sync=this.value`,"活動日期");
   if($("#eventTime"))$("#eventTime").value=r.time||"";
   if($("#eventLocation"))$("#eventLocation").value=r.location||"";

   renderSystems();
   if(r.ticketSystem&&systems.some(x=>x.name===r.ticketSystem)&&$("#ticketSystem"))$("#ticketSystem").value=r.ticketSystem;
   sales=JSON.parse(JSON.stringify(r.sales||[]));
   renderSales();
   renderPickup();

   setTimeout(()=>{
     if(r.pickup&&$("#pickupBody")){
       $("#pickupBody").querySelectorAll("[data-key]").forEach(e=>e.value=r.pickup[e.dataset.key]||"")
     }
     if($("#pickupMethod")&&r.pickupMethod)$("#pickupMethod").value=r.pickupMethod;
   },0);

 }else if(r.main==="工作"&&r.sub==="下單"){
   if($("#genericDateBox"))$("#genericDateBox").innerHTML=dateInputHTML(r.date||"",`this.dataset.sync=this.value`,"日期");
   if($("#title"))$("#title").value=r.title||"";
   if($("#memo"))$("#memo").value=r.memo||"";
   if($("#orderMorning"))$("#orderMorning").checked=(r.orderDayparts||[]).includes("早");
   if($("#orderNoon"))$("#orderNoon").checked=(r.orderDayparts||[]).includes("中")||(r.orderDayparts||[]).includes("午");
   if($("#orderEvening"))$("#orderEvening").checked=(r.orderDayparts||[]).includes("晚");
   if($("#orderRepeat"))$("#orderRepeat").checked=!!r.orderRepeat;
   if($("#orderRepeatEvery"))$("#orderRepeatEvery").value=String(r.orderRepeatEvery||1);
   if($("#orderRepeatUnit"))$("#orderRepeatUnit").value=r.orderRepeatUnit||"day";
   toggleOrderRepeat();

 }else if(r.main==="活動"&&["展覽","電影","其它"].includes(r.sub)){
   if($("#otherActivityDate"))$("#otherActivityDate").value=r.date||"";
   if($("#otherActivityTime"))$("#otherActivityTime").value=r.time||"";
   if($("#otherActivityLocation"))$("#otherActivityLocation").value=r.location||"";
   if($("#otherActivityTitle"))$("#otherActivityTitle").value=r.title||"";
   if($("#otherActivityMemo"))$("#otherActivityMemo").value=r.memo||"";

 }else if(r.main==="交易"||r.main==="面交"){
   if($("#tradeDateBox"))$("#tradeDateBox").innerHTML=dateInputHTML(r.date||"",`this.dataset.sync=this.value`,"日期");
   if($("#tradeTime"))$("#tradeTime").value=r.time||"";
   if($("#tradeLocation"))$("#tradeLocation").value=r.location||"";
   if($("#tradeTitle"))$("#tradeTitle").value=r.title||"";
   if($("#tradeContact"))$("#tradeContact").value=r.contact||"";
   if($("#tradeMemo"))$("#tradeMemo").value=r.memo||"";
   if($("#tradeBuy"))$("#tradeBuy").checked=(r.tradeTypes||[]).includes("買");
   if($("#tradeSell"))$("#tradeSell").checked=(r.tradeTypes||[]).includes("賣");
   if($("#tradeSwap"))$("#tradeSwap").checked=(r.tradeTypes||[]).includes("換");
   tradeItems=JSON.parse(JSON.stringify(r.tradeItems||[]));
   renderTradeItems();

 }else{
   if($("#genericDateBox"))$("#genericDateBox").innerHTML=dateInputHTML(r.date||"",`this.dataset.sync=this.value`,"日期");
   if($("#time"))$("#time").value=r.time||"";
   if($("#location"))$("#location").value=r.location||"";
   if($("#title"))$("#title").value=r.title||"";
   if($("#memo"))$("#memo").value=r.memo||"";
 }

 updateMainDTButtons();
 renderPhotos();
 show("form");
}

renderHome();ui();

const PERSONAL_KEY="secretaryV8PersonalSettings";
let personalBgDraft="";

function defaultPersonalSettings(){
 return {bg:"",bgSize:"cover",bgPosition:"center center",theme:"light",fontSize:"normal",showAllData:true,showReminders:true,compactReminders:false};
}
function getPersonalSettings(){
 try{return Object.assign(defaultPersonalSettings(),JSON.parse(localStorage.getItem(PERSONAL_KEY)||"{}"))}
 catch(e){return defaultPersonalSettings()}
}
function setPersonalSettingsSafe(s){
 try{
   localStorage.setItem(PERSONAL_KEY,JSON.stringify(s));
   return true;
 }catch(e){
   alert("背景圖片太大，請換一張較小的圖片。");
   return false;
 }
}
function openSideDrawer(){
 $("#sideDrawer")?.classList.add("open");
 $("#sideDrawerBackdrop")?.classList.remove("hidden");
}
function closeSideDrawer(){
 $("#sideDrawer")?.classList.remove("open");
 $("#sideDrawerBackdrop")?.classList.add("hidden");
}
function openPersonalSettings(){
 closeSideDrawer();
 let s=getPersonalSettings();
 personalBgDraft="";
 if($("#personalBgSize"))$("#personalBgSize").value=s.bgSize;
 if($("#personalBgPosition"))$("#personalBgPosition").value=s.bgPosition;
 if($("#personalTheme"))$("#personalTheme").value=s.theme;
 if($("#personalFontSize"))$("#personalFontSize").value=s.fontSize;
 if($("#personalShowAllData"))$("#personalShowAllData").checked=s.showAllData!==false;
 if($("#personalShowReminders"))$("#personalShowReminders").checked=s.showReminders!==false;
 if($("#personalCompactReminders"))$("#personalCompactReminders").checked=!!s.compactReminders;

 let wrap=$("#personalBgPreviewWrap"),img=$("#personalBgPreview"),btn=$("#personalApplyBgBtn");
 if(s.bg){
   if(img)img.src=s.bg;
   wrap?.classList.remove("hidden");
 }else{
   if(img)img.removeAttribute("src");
   wrap?.classList.add("hidden");
 }
 btn?.classList.add("hidden");
 $("#personalSettingsModal")?.classList.remove("hidden");
}
function closePersonalSettings(){
 $("#personalSettingsModal")?.classList.add("hidden");
 personalBgDraft="";
}

function compressBackgroundFile(file,callback){
 let reader=new FileReader();
 reader.onload=function(){
   let img=new Image();
   img.onload=function(){
     let maxSide=1600,w=img.width,h=img.height;
     let scale=Math.min(1,maxSide/Math.max(w,h));
     let cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
     let canvas=document.createElement("canvas");canvas.width=cw;canvas.height=ch;
     let ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,cw,ch);
     let out;
     try{out=canvas.toDataURL("image/jpeg",0.82)}catch(e){out=reader.result}
     callback(out);
   };
   img.onerror=function(){alert("這張圖片無法讀取，請換一張圖片。")};
   img.src=reader.result;
 };
 reader.onerror=function(){alert("圖片讀取失敗，請重新選擇。")};
 reader.readAsDataURL(file);
}

function previewPersonalBg(ev){
 let f=ev.target.files&&ev.target.files[0];if(!f)return;
 compressBackgroundFile(f,function(data){
   personalBgDraft=data;
   let img=$("#personalBgPreview"),wrap=$("#personalBgPreviewWrap"),btn=$("#personalApplyBgBtn");
   if(img)img.src=data;
   wrap?.classList.remove("hidden");
   btn?.classList.remove("hidden");
 });
}
function applyPreviewBackground(){
 if(!personalBgDraft)return;
 let s=getPersonalSettings();
 let old=s.bg;
 s.bg=personalBgDraft;
 if(!setPersonalSettingsSafe(s)){
   s.bg=old;
   return;
 }
 personalBgDraft="";
 $("#personalApplyBgBtn")?.classList.add("hidden");
 applyPersonalSettings();
}
function clearPersonalBg(){
 let s=getPersonalSettings();s.bg="";
 setPersonalSettingsSafe(s);
 personalBgDraft="";
 if($("#personalBgFile"))$("#personalBgFile").value="";
 if($("#personalBgPreview"))$("#personalBgPreview").removeAttribute("src");
 $("#personalBgPreviewWrap")?.classList.add("hidden");
 $("#personalApplyBgBtn")?.classList.add("hidden");
 applyPersonalSettings();
}
function savePersonalSettings(){
 let s=getPersonalSettings();
 if($("#personalBgSize"))s.bgSize=$("#personalBgSize").value;
 if($("#personalBgPosition"))s.bgPosition=$("#personalBgPosition").value;
 if($("#personalTheme"))s.theme=$("#personalTheme").value;
 if($("#personalFontSize"))s.fontSize=$("#personalFontSize").value;
 if($("#personalShowAllData"))s.showAllData=$("#personalShowAllData").checked;
 if($("#personalShowReminders"))s.showReminders=$("#personalShowReminders").checked;
 if($("#personalCompactReminders"))s.compactReminders=$("#personalCompactReminders").checked;
 if(setPersonalSettingsSafe(s))applyPersonalSettings();
}
function resetPersonalSettings(){
 setPersonalSettingsSafe(defaultPersonalSettings());
 personalBgDraft="";
 applyPersonalSettings();
 openPersonalSettings();
}
function applyPersonalSettings(){
 let s=getPersonalSettings();
 let dark=s.theme==="dark"||(s.theme==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
 document.body.classList.toggle("personalDark",dark);
 document.body.classList.toggle("personalSmall",s.fontSize==="small");
 document.body.classList.toggle("personalLarge",s.fontSize==="large");
 document.body.classList.toggle("personalCompact",!!s.compactReminders);
 document.body.classList.toggle("hasPersonalBg",!!s.bg);

 if(s.bg){
   document.body.style.backgroundImage='url("'+s.bg+'")';
   document.body.style.backgroundSize=s.bgSize||"cover";
   document.body.style.backgroundPosition=s.bgPosition||"center center";
 }else{
   document.body.style.backgroundImage="";
   document.body.style.backgroundSize="";
   document.body.style.backgroundPosition="";
 }

 let home=$("#home");
 if(home){
   let cards=home.querySelectorAll(".homeCard");
   if(cards[0])cards[0].style.display=s.showAllData===false?"none":"";
   let rem=$("#reminders");
   if(rem)rem.style.display=s.showReminders===false?"none":"";
   let remLabel=[...home.querySelectorAll("b")].find(x=>x.textContent.includes("今日")&&x.textContent.includes("提醒"));
   if(remLabel)remLabel.style.display=s.showReminders===false?"none":"";
 }
}

document.addEventListener("DOMContentLoaded",applyPersonalSettings);
</script>
<div id="sideDrawerBackdrop" class="drawerBackdrop hidden" onclick="closeSideDrawer()"></div>
<aside id="sideDrawer" class="sideDrawer">
  <div class="drawerHead">
    <b>我的小秘書</b>
    <button class="iconbtn" onclick="closeSideDrawer()">✕</button>
  </div>
  <button class="drawerItem" onclick="openPersonalSettings()">⚙️ 個人化設定</button>
</aside>

<div id="personalSettingsModal" class="personalModal hidden">
  <div class="personalPanel">
    <div class="drawerHead">
      <b>個人化設定</b>
      <button class="iconbtn" onclick="closePersonalSettings()">✕</button>
    </div>

    <div class="personalSection">
      <b>背景圖片</b>
      <div class="personalHint">選擇圖片後會先預覽，不會立即套用。</div>

      <label class="personalFileBtn">
        選擇圖片
        <input id="personalBgFile" type="file" accept="image/*" onchange="previewPersonalBg(event)">
      </label>

      <div id="personalBgPreviewWrap" class="personalBgPreviewWrap hidden">
        <img id="personalBgPreview" alt="背景預覽">
      </div>

      <div class="personalBtns">
        <button id="personalApplyBgBtn" class="primary hidden" onclick="applyPreviewBackground()">套用背景</button>
        <button class="secondary" onclick="clearPersonalBg()">移除背景</button>
      </div>

      <label>圖片大小
        <select id="personalBgSize" onchange="savePersonalSettings()">
          <option value="cover">填滿畫面</option>
          <option value="contain">完整顯示</option>
          <option value="auto">原始大小</option>
        </select>
      </label>

      <label>圖片位置
        <select id="personalBgPosition" onchange="savePersonalSettings()">
          <option value="center center">置中</option>
          <option value="center top">上方</option>
          <option value="center bottom">下方</option>
          <option value="left center">靠左</option>
          <option value="right center">靠右</option>
        </select>
      </label>
    </div>

    <div class="personalSection">
      <b>主題模式</b>
      <select id="personalTheme" onchange="savePersonalSettings()">
        <option value="light">淺色</option>
        <option value="dark">深色</option>
        <option value="system">跟隨系統</option>
      </select>
    </div>

    <div class="personalSection">
      <b>字體大小</b>
      <select id="personalFontSize" onchange="savePersonalSettings()">
        <option value="small">小</option>
        <option value="normal">標準</option>
        <option value="large">大</option>
      </select>
    </div>

    <div class="personalSection">
      <b>首頁顯示</b>
      <label class="personalCheck"><input id="personalShowAllData" type="checkbox" onchange="savePersonalSettings()"> 顯示「全部資料」</label>
      <label class="personalCheck"><input id="personalShowReminders" type="checkbox" onchange="savePersonalSettings()"> 顯示「今日／近期提醒」</label>
    </div>

    <div class="personalSection">
      <b>提醒顯示</b>
      <label class="personalCheck"><input id="personalCompactReminders" type="checkbox" onchange="savePersonalSettings()"> 精簡提醒卡片</label>
    </div>

    <button class="secondary personalReset" onclick="resetPersonalSettings()">恢復預設設定</button>
  </div>
</div>

</body></html>
